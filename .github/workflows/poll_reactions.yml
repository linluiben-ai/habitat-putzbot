name: Putzplan Reaktionen prüfen

# Schaut nach, ob jemand mit ✅/❌ auf seine Auslos-DM reagiert hat, und
# wickelt Tauschwünsche ab. Ersetzt den Webhook-Server: der Bot fragt aktiv
# nach, statt sich von Slack anrufen zu lassen.

on:
  schedule:
    # Cron läuft in UTC. Diese Zeiten entsprechen etwa 08/11/14/17/20 Uhr (MEZ)
    # bzw. 09/12/15/18/21 Uhr (MESZ) — also den Wachzeiten.
    - cron: '0 7,10,13,16,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run — nichts schreiben, nur anzeigen'
        type: boolean
        default: false
      debug:
        description: 'Debug — ausführliche Diagnose'
        type: boolean
        default: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Zwei Läufe gleichzeitig könnten dieselbe Reaktion doppelt bearbeiten.
    concurrency:
      group: putzbot-schreibzugriff
      cancel-in-progress: false

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Python aufsetzen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reaktionen prüfen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          DS_A_ID: ${{ secrets.DS_A_ID }}
          DS_B_ID: ${{ secrets.DS_B_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG: ${{ inputs.debug }}
        run: python main.py poll
