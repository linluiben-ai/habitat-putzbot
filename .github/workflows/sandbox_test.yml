name: Putzbot Sandbox-Test

# Testlauf gegen den Sandbox-Slack-Workspace und die Notion-Testkopie.
#
# SANDBOX und USE_TEST_DATA stehen hier fest verdrahtet und sind NICHT als
# Input wählbar: dieser Workflow soll die Produktivdaten strukturell nicht
# erreichen können, auch nicht bei einem Fehlklick. Der produktive Ablauf
# läuft weiter über monday_cleanup.yml / poll_reactions.yml.
#
# Weil config.py im Sandbox-Modus SLACK_TOKEN, SLACK_CHANNEL_ID, DS_B_ID und
# TEMPLATE_ID durch die SANDBOX_*- bzw. TEST_*-Werte ersetzt, braucht dieser
# Lauf von den Produktiv-Secrets nur NOTION_TOKEN und DS_A_ID (die
# Mitgliederliste wird ausschließlich gelesen).

on:
  workflow_dispatch:
    inputs:
      modus:
        description: 'Betriebsart'
        type: choice
        default: 'weekly'
        options:
          - weekly
          - poll
          - draw
          - plan
      dry_run:
        description: 'Dry Run — nichts in Notion/Slack schreiben'
        type: boolean
        default: true
      debug:
        description: 'Debug — ausführliche Diagnose (Poolgrößen, DM-Metadata)'
        type: boolean
        default: true
      force_plan:
        description: 'Plan-Lauf erzwingen (nur für Modus "weekly" relevant)'
        type: boolean
        default: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    # Teilt sich die Gruppe mit den Produktivworkflows: zwei gleichzeitige
    # Läufe könnten dieselbe Reaktion doppelt bearbeiten.
    concurrency:
      group: putzbot-schreibzugriff
      cancel-in-progress: false

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Python aufsetzen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # TEMPORÄR — wieder entfernen, sobald die Secret-Frage geklärt ist.
      #
      # Gibt ausschließlich Zeichenlängen aus, nie Werte. Bewusst einzelne
      # Abfragen statt toJSON(secrets): das Ausgeben aller Secrets auf einmal
      # lässt GitHub den Lauf gar nicht erst starten (conclusion
      # 'action_required').
      #
      # Neben den erwarteten Namen ein paar plausible Schreibweisen — 0 bei
      # allen heißt 'nicht angelegt', ein Treffer heißt 'heißt anders'.
      - name: Diagnose — welche Secret-Namen sind belegt
        env:
          S01_SANDBOX_SLACK_TOKEN: ${{ secrets.SANDBOX_SLACK_TOKEN }}
          S02_SANDBOX_SLACK_CHANNEL_ID: ${{ secrets.SANDBOX_SLACK_CHANNEL_ID }}
          S03_SANDBOX_SLACK_TEST_USER_ID: ${{ secrets.SANDBOX_SLACK_TEST_USER_ID }}
          S04_SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          S05_SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          S06_SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
          S07_SANDBOX_CHANNEL_ID: ${{ secrets.SANDBOX_CHANNEL_ID }}
          S08_SLACK_SANDBOX_TOKEN: ${{ secrets.SLACK_SANDBOX_TOKEN }}
          S09_SLACK_SANDBOX_CHANNEL_ID: ${{ secrets.SLACK_SANDBOX_CHANNEL_ID }}
          S10_SANDBOX_SLACK_BOT_TOKEN: ${{ secrets.SANDBOX_SLACK_BOT_TOKEN }}
          S11_NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          S12_DS_A_ID: ${{ secrets.DS_A_ID }}
          S13_DS_B_ID: ${{ secrets.DS_B_ID }}
          S14_TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          S15_TEST_DS_B_ID: ${{ secrets.TEST_DS_B_ID }}
          S16_TEST_TEMPLATE_ID: ${{ secrets.TEST_TEMPLATE_ID }}
        run: |
          echo "Zeichenlänge je Secret-Name (0 = nicht vorhanden oder leer):"
          for name in $(env | grep -o '^S[0-9][0-9]_[A-Z_]*' | sort); do
            wert="${!name}"
            printf '  %-34s %s\n' "${name#S??_}" "${#wert}"
          done

      - name: Tests
        run: python tests.py

      - name: Sandbox-Lauf
        env:
          # --- fest verdrahtet: dieser Workflow kann nur in die Sandbox ---
          SANDBOX: 'true'
          USE_TEST_DATA: 'true'

          # Jeweils mit Fallback auf Repository-Variables: IDs sind nicht
          # geheim und liegen deshalb gern mal im Variables-Reiter statt bei
          # den Secrets. Ein gesetztes Secret gewinnt immer.
          #
          # --- Sandbox-Slack ---
          SANDBOX_SLACK_TOKEN: ${{ secrets.SANDBOX_SLACK_TOKEN || vars.SANDBOX_SLACK_TOKEN }}
          SANDBOX_SLACK_CHANNEL_ID: ${{ secrets.SANDBOX_SLACK_CHANNEL_ID || vars.SANDBOX_SLACK_CHANNEL_ID }}
          SANDBOX_SLACK_TEST_USER_ID: ${{ secrets.SANDBOX_SLACK_TEST_USER_ID || vars.SANDBOX_SLACK_TEST_USER_ID }}

          # --- Notion-Testkopie ---
          TEST_DS_B_ID: ${{ secrets.TEST_DS_B_ID || vars.TEST_DS_B_ID }}
          TEST_TEMPLATE_ID: ${{ secrets.TEST_TEMPLATE_ID || vars.TEST_TEMPLATE_ID }}
          TEST_PUTZPLAN_RELATION_PROP: ${{ secrets.TEST_PUTZPLAN_RELATION_PROP || vars.TEST_PUTZPLAN_RELATION_PROP }}

          # --- nur lesend: die Mitgliederliste gibt es nur einmal ---
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DS_A_ID: ${{ secrets.DS_A_ID }}

          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG: ${{ inputs.debug }}
          FORCE_PLAN: ${{ inputs.force_plan }}
        run: python main.py ${{ inputs.modus }}
